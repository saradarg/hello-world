<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* Pick the theme before the page paints, so it never flashes the wrong colors */
  (function () {
    var t = null;
    try { t = localStorage.getItem('hw-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* ---------- Pastel color palette ---------- */
  :root {
    --bg-1: #ffe5ef;
    --bg-2: #e4f1ff;
    --bg-3: #eafbe9;
    --blob-1: #ffc8dd;
    --blob-2: #bde0fe;
    --blob-3: #d8c4f0;
    --blob-4: #caffbf;
    --blob-5: #fff1b6;
    --card: rgba(255, 255, 255, 0.55);
    --card-border: rgba(255, 255, 255, 0.85);
    --text: #4b4766;
    --muted: #8c87ab;
    --grad-1: #f7a1c4;
    --grad-2: #a99bfa;
    --grad-3: #7cc0f7;
    --accent: #a99bfa;
    --shadow: 0 24px 70px rgba(169, 155, 250, 0.28);
    --btn-bg: rgba(255, 255, 255, 0.7);
    --btn-hover: rgba(255, 255, 255, 0.95);
    --input-bg: rgba(255, 255, 255, 0.85);
  }
  [data-theme="dark"] {
    --bg-1: #1f1b30;
    --bg-2: #18213a;
    --bg-3: #261c31;
    --blob-1: #8a4f73;
    --blob-2: #3d5f8f;
    --blob-3: #5f4a86;
    --blob-4: #36705c;
    --blob-5: #806d3a;
    --card: rgba(42, 37, 64, 0.55);
    --card-border: rgba(255, 255, 255, 0.12);
    --text: #eeeaff;
    --muted: #aca6cf;
    --grad-1: #ffb8d5;
    --grad-2: #c9beff;
    --grad-3: #a9dbff;
    --accent: #c9beff;
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    --btn-bg: rgba(60, 54, 90, 0.7);
    --btn-hover: rgba(80, 72, 116, 0.9);
    --input-bg: rgba(30, 27, 48, 0.85);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
    background-attachment: fixed;
    overflow-x: hidden;
    transition: background 0.6s ease, color 0.6s ease;
  }

  /* ---------- Floating background blobs ---------- */
  .blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.75;
    animation: float 18s ease-in-out infinite;
    transition: background 0.6s ease;
  }
  .blob:nth-child(1) { width: 42vmax; height: 42vmax; background: var(--blob-1); top: -14vmax; left: -12vmax; }
  .blob:nth-child(2) { width: 36vmax; height: 36vmax; background: var(--blob-2); bottom: -14vmax; right: -10vmax; animation-delay: -5s; }
  .blob:nth-child(3) { width: 26vmax; height: 26vmax; background: var(--blob-3); top: 40%; left: 55%; animation-delay: -9s; }
  .blob:nth-child(4) { width: 22vmax; height: 22vmax; background: var(--blob-4); bottom: 5%; left: 8%; animation-delay: -13s; }
  .blob:nth-child(5) { width: 18vmax; height: 18vmax; background: var(--blob-5); top: 8%; right: 25%; animation-delay: -3s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(4vmax, -3vmax) scale(1.08); }
    66%      { transform: translate(-3vmax, 3vmax) scale(0.94); }
  }

  /* ---------- Twinkling sparkles ---------- */
  .sparkle {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    color: var(--accent);
    opacity: 0;
    animation: twinkle 4s ease-in-out infinite;
    font-size: 14px;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    50%      { opacity: 0.9; transform: scale(1.1) rotate(45deg); }
  }

  /* ---------- Top-right corner: clock + theme toggle ---------- */
  .topbar {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .glass {
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: var(--shadow);
    transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
  }

  .clock {
    padding: 10px 18px;
    border-radius: 18px;
    text-align: right;
    line-height: 1.25;
  }
  .clock-time {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .clock-date {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
  }

  .icon-btn {
    display: inline-grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--btn-bg);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, background 0.3s ease, color 0.6s ease;
  }
  .icon-btn:hover { transform: translateY(-2px) scale(1.06); background: var(--btn-hover); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .icon-btn svg { width: 22px; height: 22px; }

  /* Show the moon in light mode (click to go dark) and the sun in dark mode */
  .icon-sun { display: none; }
  [data-theme="dark"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }

  .spin svg { animation: spin 0.6s cubic-bezier(.5, 1.6, .4, 1); }
  @keyframes spin { from { transform: rotate(-180deg) scale(0.4); } to { transform: rotate(0) scale(1); } }

  /* ---------- Center card ---------- */
  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 110px 16px 40px;
  }

  .card {
    width: min(760px, 100%);
    padding: clamp(32px, 6vw, 64px) clamp(20px, 5vw, 56px);
    border-radius: 36px;
    text-align: center;
    animation: bob 6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .eyebrow {
    display: inline-block;
    margin-bottom: 18px;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--btn-bg);
    border: 1px solid var(--card-border);
  }

  .message {
    margin: 0;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 9vw, 6.2rem);
    line-height: 1.08;
    overflow-wrap: anywhere;
    background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3), var(--grad-1));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 8s linear infinite;
    filter: drop-shadow(0 6px 18px rgba(169, 155, 250, 0.25));
  }
  @keyframes shimmer { to { background-position: 300% 0; } }

  .wave { display: inline-block; font-size: 2.2rem; margin-top: 10px; animation: wave 2.4s ease-in-out infinite; transform-origin: 70% 70%; }
  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0); }
    10%, 30% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
  }

  .actions { margin-top: 22px; display: flex; justify-content: center; gap: 12px; }

  /* ---------- Edit form ---------- */
  .edit-form { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .edit-form[hidden], .view[hidden] { display: none; }

  .edit-input {
    width: 100%;
    padding: 16px 22px;
    border-radius: 20px;
    border: 2px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text);
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(1.3rem, 4vw, 2rem);
    text-align: center;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .edit-input:focus { border-color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 25%, transparent); }
  .edit-input.shake { animation: shake 0.4s; border-color: var(--grad-1); }
  @keyframes shake {
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  .hint { font-size: 0.85rem; color: var(--muted); }

  .icon-btn.save { color: #fff; background: linear-gradient(135deg, var(--grad-2), var(--grad-3)); border-color: transparent; }
  .icon-btn.cancel:hover { color: #e57399; }

  /* ---------- Confetti burst on save ---------- */
  .confetti {
    position: fixed;
    z-index: 20;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    pointer-events: none;
    animation: pop 1s ease-out forwards;
  }
  @keyframes pop {
    to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 600px) {
    .topbar { top: 16px; right: 16px; left: 16px; justify-content: flex-end; }
    .clock { padding: 8px 14px; }
    .clock-time { font-size: 1.1rem; }
    .clock-date { font-size: 0.72rem; }
    .icon-btn { width: 44px; height: 44px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <!-- Background decoration -->
  <div class="blobs" aria-hidden="true">
    <div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div>
  </div>
  <div id="sparkles" aria-hidden="true"></div>

  <!-- Top-right: date/time + theme toggle -->
  <header class="topbar">
    <div class="clock glass" aria-live="off">
      <div class="clock-time" id="time">--:--:--</div>
      <div class="clock-date" id="date">&nbsp;</div>
    </div>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme">
      <!-- Moon -->
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <!-- Sun -->
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <!-- Center: the message -->
  <main>
    <section class="card glass">
      <!-- View mode -->
      <div class="view" id="view">
        <h1 class="message" id="message">Hello, World!</h1>
        <div class="wave" aria-hidden="true">👋</div>
        <div class="actions">
          <button class="icon-btn" id="editBtn" type="button" aria-label="Edit message" title="Edit message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Edit mode -->
      <form class="edit-form" id="editForm" hidden>
        <label for="editInput" class="hint">Type your new message</label>
        <input class="edit-input" id="editInput" type="text" maxlength="60" autocomplete="off">
        <div class="actions">
          <button class="icon-btn save" type="submit" aria-label="Save message" title="Save (Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </button>
          <button class="icon-btn" id="resetBtn" type="button" aria-label="Reset to Hello, World!" title="Reset to Hello, World!">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
          <button class="icon-btn cancel" id="cancelBtn" type="button" aria-label="Cancel editing" title="Cancel (Esc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <span class="hint">Enter to save · Esc to cancel</span>
      </form>
    </section>
  </main>

<script>
(function () {
  var root = document.documentElement;
  var DEFAULT_MESSAGE = 'Hello, World!';

  // Safe storage helpers (storage can be blocked in private windows)
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- Theme toggle ---------- */
  var toggle = document.getElementById('themeToggle');
  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    var label = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
    toggle.setAttribute('aria-label', label);
    toggle.title = label;
  }
  applyTheme(root.getAttribute('data-theme') || 'light');
  toggle.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    store.set('hw-theme', next);
    toggle.classList.remove('spin');
    void toggle.offsetWidth; // restart the animation
    toggle.classList.add('spin');
  });

  /* ---------- Live date & time ---------- */
  var timeEl = document.getElementById('time');
  var dateEl = document.getElementById('date');
  function tick() {
    var now = new Date();
    timeEl.textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Editable message ---------- */
  var message = document.getElementById('message');
  var view = document.getElementById('view');
  var form = document.getElementById('editForm');
  var input = document.getElementById('editInput');

  message.textContent = store.get('hw-message') || DEFAULT_MESSAGE;

  function startEdit() {
    input.value = message.textContent;
    view.hidden = true;
    form.hidden = false;
    input.focus();
    input.select();
  }
  function stopEdit() {
    form.hidden = true;
    view.hidden = false;
    document.getElementById('editBtn').focus();
  }

  document.getElementById('editBtn').addEventListener('click', startEdit);
  message.addEventListener('dblclick', startEdit);
  document.getElementById('cancelBtn').addEventListener('click', stopEdit);
  document.getElementById('resetBtn').addEventListener('click', function () {
    input.value = DEFAULT_MESSAGE;
    input.focus();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') stopEdit();
  });
  input.addEventListener('animationend', function () { input.classList.remove('shake'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var value = input.value.trim();
    if (!value) {
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      return;
    }
    message.textContent = value;
    store.set('hw-message', value);
    stopEdit();
    burst();
  });

  /* ---------- Confetti burst ---------- */
  var colors = ['#ffc8dd', '#bde0fe', '#d8c4f0', '#caffbf', '#fff1b6', '#ffd6a5', '#a99bfa'];
  function burst() {
    var r = message.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    for (var i = 0; i < 36; i++) {
      var dot = document.createElement('span');
      dot.className = 'confetti';
      var angle = Math.random() * Math.PI * 2;
      var dist = 80 + Math.random() * 180;
      dot.style.left = cx + 'px';
      dot.style.top = cy + 'px';
      dot.style.background = colors[i % colors.length];
      dot.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      dot.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      var size = 6 + Math.random() * 8;
      dot.style.width = dot.style.height = size + 'px';
      dot.addEventListener('animationend', function () { this.remove(); });
      document.body.appendChild(dot);
    }
  }

  /* ---------- Sparkles ---------- */
  var sparkles = document.getElementById('sparkles');
  for (var s = 0; s < 18; s++) {
    var sp = document.createElement('span');
    sp.className = 'sparkle';
    sp.textContent = '✦';
    sp.style.left = Math.random() * 100 + 'vw';
    sp.style.top = Math.random() * 100 + 'vh';
    sp.style.animationDelay = (Math.random() * 4) + 's';
    sp.style.fontSize = (8 + Math.random() * 12) + 'px';
    sparkles.appendChild(sp);
  }
})();
</script>
</body>
</html>
